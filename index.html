<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS แม่บุญส่ง - Full Master Version</title>
    
    <!-- External Resources -->
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700;800&family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body { font-family: 'Anuphan', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; color: #1e293b; margin: 0; }
        .receipt-font { font-family: 'Chakra Petch', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
        .active-scale:active { transform: scale(0.96); transition: transform 0.1s; }
        
        /* Receipt UI Optimization */
        .receipt-print-area { background: white; width: 450px; padding: 60px 45px; position: relative; border-top: 15px solid #b91c1c; margin: 0 auto; box-sizing: border-box; }
        .receipt-zigzag { position: absolute; bottom: -12px; left: 0; width: 100%; height: 12px; background: linear-gradient(-135deg, white 6px, transparent 0), linear-gradient(135deg, white 6px, transparent 0); background-size: 12px 12px; }
        .dashed-line { border-top: 2px dashed #cbd5e1; margin: 20px 0; width: 100%; }
        
        #app-loading { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 1rem; color: #b91c1c; font-weight: 800; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #b91c1c; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root">
        <div id="app-loading">
            <div class="spinner"></div>
            <p>กำลังเตรียมเมนูอาหาร...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Native SVG Icons ---
        const ICONS = {
            Utensils: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
            LayoutGrid: '<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
            Plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
            Minus: '<path d="M5 12h14"/>',
            Trash2: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
            ChevronLeft: '<path d="m15 18-6-6 6-6"/>',
            Banknote: '<rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>',
            CreditCard: '<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/>',
            Download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="3" y2="15"/>',
            CheckCircle2: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
            Heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
            PlusCircle: '<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/>',
            Star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'
        };

        const Icon = ({ name, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: ICONS[name] || '' }} />
        );

        const CURRY_OPTIONS = ['น้ำยากะทิ', 'น้ำยาป่า', 'แกงเขียวหวาน', 'น้ำเงี้ยว', 'น้ำพริก', 'แกงไตปลา'];

        const MENU = {
            khanomJeenRad: [
                { id: 'kjr_kathi', name: 'ขนมจีน (ราดกะทิ)', price: 40, category: 'ขนมจีนราดน้ำ' },
                { id: 'kjr_pa', name: 'ขนมจีน (ราดน้ำยาป่า)', price: 40, category: 'ขนมจีนราดน้ำ' },
                { id: 'kjr_green', name: 'ขนมจีน (ราดเขียวหวาน)', price: 40, category: 'ขนมจีนราดน้ำ' },
                { id: 'kjr_ngiao', name: 'ขนมจีน (ราดน้ำเงี้ยว)', price: 40, category: 'ขนมจีนราดน้ำ' },
                { id: 'kjr_prik', name: 'ขนมจีน (ราดน้ำพริก)', price: 40, category: 'ขนมจีนราดน้ำ' },
                { id: 'kjr_tai', name: 'ขนมจีน (ราดไตปลา)', price: 40, category: 'ขนมจีนราดน้ำ' },
            ],
            khanomJeenSet: [
                { id: 'kjs_kathi', name: 'ชุดเล็ก (แยกน้ำกะทิ)', price: 50, category: 'ขนมจีนชุดแยกน้ำ' },
                { id: 'kjs_pa', name: 'ชุดเล็ก (แยกน้ำยาป่า)', price: 50, category: 'ขนมจีนชุดแยกน้ำ' },
                { id: 'kjs_green', name: 'ชุดเล็ก (แยกเขียวหวาน)', price: 50, category: 'ขนมจีนชุดแยกน้ำ' },
                { id: 'kjs_ngiao', name: 'ชุดเล็ก (แยกน้ำเงี้ยว)', price: 50, category: 'ขนมจีนชุดแยกน้ำ' },
                { id: 'kjs_prik', name: 'ชุดเล็ก (แยกน้ำพริก)', price: 50, category: 'ขนมจีนชุดแยกน้ำ' },
                { id: 'kjs_tai', name: 'ชุดเล็ก (แยกไตปลา)', price: 50, category: 'ขนมจีนชุดแยกน้ำ' },
            ],
            khanomJeenHome: [
                { id: 'kjh_kathi', name: 'กลับบ้าน (น้ำยากะทิ)', price: 60, category: 'ขนมจีน (กลับบ้าน)' },
                { id: 'kjh_pa', name: 'กลับบ้าน (น้ำยาป่า)', price: 60, category: 'ขนมจีน (กลับบ้าน)' },
                { id: 'kjh_green', name: 'กลับบ้าน (เขียวหวาน)', price: 60, category: 'ขนมจีน (กลับบ้าน)' },
                { id: 'kjh_ngiao', name: 'กลับบ้าน (น้ำเงี้ยว)', price: 60, category: 'ขนมจีน (กลับบ้าน)' },
            ],
            somTum: [
                { id: 'st_thai', name: 'ตำไทย', price: 50, category: 'ส้มตำ' },
                { id: 'st_pu', name: 'ตำปู', price: 50, category: 'ส้มตำ' },
                { id: 'st_plara', name: 'ตำปลาร้า', price: 50, category: 'ส้มตำ' },
                { id: 'st_hoy', name: 'ตำหอยดอง', price: 50, category: 'ส้มตำ' },
                { id: 'st_kaikem', name: 'ตำไข่เค็ม', price: 60, category: 'ส้มตำ' },
                { id: 'st_tang', name: 'ตำแตง', price: 60, category: 'ส้มตำ' },
            ],
            madeToOrder: [
                { id: 'mo_yam', name: 'ยำขนมจีน', price: 60, category: 'อาหารตามสั่ง/ยำ' },
                { id: 'mo_kaprao', name: 'กะเพรา (หมู/ไก่/ทะเล)', price: 50, category: 'อาหารตามสั่ง/ยำ' },
                { id: 'mo_fried_rice', name: 'ข้าวผัด', price: 50, category: 'อาหารตามสั่ง/ยำ' },
                { id: 'mo_omelette', name: 'ข้าวไข่เจียว', price: 50, category: 'อาหารตามสั่ง/ยำ' },
                { id: 'mo_larb', name: 'ลาบหมู', price: 60, category: 'อาหารตามสั่ง/ยำ' },
            ],
            specialSet: [
                { id: 'kj_4girls', name: 'ชุดสี่สาว (เลือกน้ำยา 4 อย่าง)', price: 140, category: 'ชุดพิเศษ', isSpecial: true },
                { id: 'kj_sao', name: 'ขนมจีน ซาวน้ำ', price: 60, category: 'ชุดพิเศษ' },
            ],
            sideExtra: [
                { id: 'sp_hor', name: 'ห่อหมกปลาช่อน', price: 40, category: 'เครื่องเคียง/พิเศษ' },
                { id: 'sp_chicken', name: 'ไก่ทอด', price: 10, category: 'เครื่องเคียง/พิเศษ' },
                { id: 'sp_pork', name: 'หมูทอด', price: 10, category: 'เครื่องเคียง/พิเศษ' },
                { id: 'sp_egg', name: 'ไข่ต้ม', price: 10, category: 'เครื่องเคียง/พิเศษ' },
                { id: 'sp_jack', name: 'ขนุน', price: 20, category: 'เครื่องเคียง/พิเศษ' },
                { id: 'sp_tuay', name: 'ขนมถ้วย (กล่อง)', price: 30, category: 'เครื่องเคียง/พิเศษ' },
            ],
            drinks: [
                { id: 'ds_lod', name: 'ลอดช่อง', price: 50, category: 'ขนมหวาน/เครื่องดื่ม' },
                { id: 'ds_water', name: 'น้ำเปล่า', price: 10, category: 'ขนมหวาน/เครื่องดื่ม' },
                { id: 'ds_coke', name: 'โค๊ก', price: 20, category: 'ขนมหวาน/เครื่องดื่ม' },
                { id: 'ds_soft', name: 'น้ำอัดลม', price: 15, category: 'ขนมหวาน/เครื่องดื่ม' },
                { id: 'ds_ice', name: 'น้ำแข็งเปล่า (แก้ว)', price: 2, category: 'ขนมหวาน/เครื่องดื่ม' },
            ]
        };

        const App = () => {
            const [tables, setTables] = useState(() => JSON.parse(localStorage.getItem('mb_pos_v_final_1') || '{}'));
            const [activeTable, setActiveTable] = useState(null);
            const [view, setView] = useState('table-selection');
            const [paymentMethod, setPaymentMethod] = useState('cash'); 
            const [receivedAmount, setReceivedAmount] = useState('');
            const [isProcessing, setIsProcessing] = useState(false);
            const [customName, setCustomName] = useState('');
            const [customPrice, setCustomPrice] = useState('');
            const [showCustomForm, setShowCustomForm] = useState(false);
            const [fourGirlsModal, setFourGirlsModal] = useState(false);
            const [tempCurries, setTempCurries] = useState([]);
            
            const receiptRef = useRef(null);

            useEffect(() => { localStorage.setItem('mb_pos_v_final_1', JSON.stringify(tables)); }, [tables]);

            const getTableTotal = (num) => (tables[num] || []).reduce((sum, item) => sum + (item.price * item.quantity), 0);

            const addItem = (item, details = null) => {
                if (item.id === 'kj_4girls' && !details) {
                    setTempCurries([]);
                    setFourGirlsModal(true);
                    return;
                }
                setTables(prev => {
                    const list = prev[activeTable] || [];
                    const entryId = details ? `${item.id}-${details.join('-')}` : item.id;
                    const idx = list.findIndex(i => i.entryId === entryId);
                    let newList;
                    if (idx > -1) { newList = [...list]; newList[idx].quantity += 1; }
                    else { newList = [...list, { ...item, entryId, details, quantity: 1 }]; }
                    return { ...prev, [activeTable]: newList };
                });
            };

            const addCustom = () => {
                if (!customName || !customPrice) return;
                addItem({ id: `c-${Date.now()}`, name: customName, price: parseFloat(customPrice), category: 'พิเศษ' });
                setCustomName(''); setCustomPrice(''); setShowCustomForm(false);
            };

            const removeItem = (id) => {
                setTables(prev => {
                    const list = prev[activeTable] || [];
                    const idx = list.findIndex(i => i.entryId === id);
                    if (idx === -1) return prev;
                    let next = [...list];
                    if (next[idx].quantity > 1) { next[idx].quantity -= 1; return { ...prev, [activeTable]: next }; }
                    return { ...prev, [activeTable]: list.filter(i => i.entryId !== id) };
                });
            };

            const saveAndDownload = async () => {
                if (!receiptRef.current) return;
                setIsProcessing(true);
                try {
                    const canvas = await html2canvas(receiptRef.current, { scale: 2.5, backgroundColor: '#ffffff', useCORS: true });
                    const link = document.createElement('a');
                    link.download = `Receipt-T${activeTable}-${Date.now()}.png`;
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                } catch (e) { alert("Error!"); } finally { setIsProcessing(false); }
            };

            const generateQR = (amount) => {
                const formatID = (id, val) => id + val.length.toString().padStart(2, '0') + val;
                let p = '000201010212' + formatID('29', formatID('00', 'A000000677010111') + formatID('01', '3897208520')) + '5303764';
                if (amount > 0) p += formatID('54', parseFloat(amount).toFixed(2));
                p += '5802TH6304';
                const crc16 = (d) => {
                    let c = 0xFFFF;
                    for (let i = 0; i < d.length; i++) {
                        let x = ((c >> 8) ^ d.charCodeAt(i)) & 0xFF; x ^= x >> 4;
                        c = ((c << 8) ^ (x << 12) ^ (x << 5) ^ x) & 0xFFFF;
                    }
                    return c.toString(16).toUpperCase().padStart(4, '0');
                };
                return p + crc16(p);
            };

            const total = getTableTotal(activeTable);
            const change = receivedAmount ? parseFloat(receivedAmount) - total : 0;

            return (
                <div className="min-h-screen max-w-md mx-auto bg-[#f8fafc] shadow-2xl">
                    {/* Header */}
                    <header className="bg-white border-b border-slate-100 p-4 sticky top-0 z-50 flex justify-between items-center shadow-sm">
                        <div onClick={() => { setView('table-selection'); setActiveTable(null); }} className="cursor-pointer active-scale">
                            <h1 className="text-xl font-black text-red-700 flex items-center gap-2 tracking-tighter">
                                <Icon name="Utensils" size={20} className="text-red-600" /> แม่บุญส่ง <span className="text-[10px] bg-red-100 px-2 py-0.5 rounded-full font-bold">POS</span>
                            </h1>
                        </div>
                        {view !== 'table-selection' && <button onClick={() => setView('table-selection')} className="p-2 bg-slate-100 rounded-xl active-scale"><Icon name="LayoutGrid" size={22} /></button>}
                    </header>

                    <main className="p-4">
                        {view === 'table-selection' ? (
                            <div className="animate-in pt-4">
                                <h2 className="text-xl font-black mb-8 px-2 flex items-center gap-2"><Icon name="Users" size={20} className="text-red-600" /> เลือกลูกค้า</h2>
                                <div className="grid grid-cols-3 gap-5">
                                    {[1,2,3,4,5,6,7,8,9].map(num => (
                                        <button key={num} onClick={() => { setActiveTable(num); setView('order-entry'); }} 
                                            className={`aspect-square rounded-[2.5rem] bg-white border-2 flex flex-col items-center justify-center shadow-sm transition-all active-scale ${getTableTotal(num) > 0 ? 'border-red-500 ring-4 ring-red-50 shadow-lg' : 'border-slate-100'}`}>
                                            <span className={`text-4xl font-black ${getTableTotal(num) > 0 ? 'text-red-700' : 'text-slate-200'}`}>{num}</span>
                                            {getTableTotal(num) > 0 && <span className="bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full mt-2 font-bold tracking-tight">฿{getTableTotal(num)}</span>}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        ) : view === 'order-entry' ? (
                            <div className="animate-in pb-32">
                                <div className="bg-red-700 text-white p-6 rounded-[2.5rem] flex justify-between items-center mb-6 shadow-xl shadow-red-100">
                                    <div className="flex items-center gap-4"><div className="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center font-black text-2xl">{activeTable}</div><h2 className="text-xl font-black leading-none">โต๊ะ {activeTable}</h2></div>
                                    <p className="text-3xl font-black">฿{total}</p>
                                </div>

                                <div className="mb-6 bg-white p-4 rounded-3xl border-2 border-indigo-100">
                                    <button onClick={() => setShowCustomForm(!showCustomForm)} className="w-full flex items-center justify-center gap-2 font-bold text-indigo-700 active-scale py-1">
                                        <Icon name="PlusCircle" size={18} /> {showCustomForm ? 'ยกเลิกรายการพิเศษ' : 'เพิ่มรายการอื่น / ตั้งราคาเอง'}
                                    </button>
                                    {showCustomForm && (
                                        <div className="mt-4 space-y-3 animate-in">
                                            <input type="text" placeholder="ชื่อสินค้า..." value={customName} onChange={e => setCustomName(e.target.value)} className="w-full p-3 bg-slate-50 rounded-xl outline-none font-bold" />
                                            <input type="number" placeholder="ราคา..." value={customPrice} onChange={e => setCustomPrice(e.target.value)} className="w-full p-3 bg-slate-50 rounded-xl outline-none font-black text-red-600" />
                                            <button onClick={addCustom} className="w-full py-3 bg-indigo-600 text-white rounded-xl font-black active-scale shadow-lg">เพิ่มลงบิล</button>
                                        </div>
                                    )}
                                </div>

                                <div className="space-y-10">
                                    {Object.entries(MENU).map(([key, items]) => (
                                        <div key={key}>
                                            <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 border-l-4 border-red-500 pl-3 leading-none">{items[0].category}</h3>
                                            <div className="grid gap-3">
                                                {items.map(item => (
                                                    <div key={item.id} onClick={() => addItem(item)} className="bg-white p-4 rounded-3xl flex justify-between items-center border border-slate-100 shadow-sm active-scale">
                                                        <div className="flex-1 pr-2"><h4 className="font-bold text-slate-800 text-lg leading-tight">{item.name}</h4><div className="flex items-center gap-2 mt-1"><span className="text-red-600 font-black text-lg">฿{item.price}</span>{item.isSpecial && <span className="text-[9px] bg-orange-100 text-orange-600 px-2 py-0.5 rounded-full font-black uppercase">แนะนำ</span>}</div></div>
                                                        <div className="w-11 h-11 bg-slate-50 text-red-600 rounded-2xl flex items-center justify-center shadow-inner"><Icon name="Plus" size={24} /></div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {(tables[activeTable] || []).length > 0 && (
                                    <div className="mt-12 bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm animate-in">
                                        <h3 className="font-black text-sm mb-4">รายการปัจจุบัน</h3>
                                        <div className="divide-y divide-slate-50">
                                            {tables[activeTable].map(item => (
                                                <div key={item.entryId} className="py-4 flex justify-between items-center">
                                                    <div className="flex-1 pr-4">
                                                        <p className="font-bold text-slate-700 leading-tight">{item.name}</p>
                                                        {item.details && <p className="text-[10px] text-red-500 font-bold mt-1 leading-tight">{item.details.join(', ')}</p>}
                                                    </div>
                                                    <div className="flex items-center gap-4 bg-slate-50 p-1 rounded-xl">
                                                        <button onClick={() => removeItem(item.entryId)} className="w-8 h-8 bg-white text-slate-400 rounded-lg shadow-sm active-scale flex items-center justify-center"><Icon name="Minus" size={14} /></button>
                                                        <span className="font-black text-lg min-w-[20px] text-center text-red-600">{item.quantity}</span>
                                                        <button onClick={() => addItem(item, item.details)} className="w-8 h-8 bg-red-700 text-white rounded-lg shadow-sm active-scale flex items-center justify-center"><Icon name="Plus" size={14} /></button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-xl border-t z-40">
                                    <div className="max-w-md mx-auto flex gap-3">
                                        <button onClick={() => { if(confirm('ล้างรายการทั้งหมด?')) { setTables({...tables, [activeTable]: []}); } }} className="p-5 bg-slate-100 text-slate-400 rounded-3xl active-scale"><Icon name="Trash2" size={24} /></button>
                                        <button onClick={() => { setReceivedAmount(''); setView('checkout'); }} disabled={total === 0} className="flex-1 py-5 bg-red-700 text-white rounded-[2rem] font-black text-xl shadow-xl active-scale disabled:bg-slate-200">ดูบิล / คิดเงิน</button>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="animate-in pb-20">
                                <div className="flex items-center gap-4 mb-6">
                                    <button onClick={() => setView('order-entry')} className="p-3 bg-white border border-slate-100 rounded-2xl text-slate-400 active-scale"><Icon name="ChevronLeft" size={24} /></button>
                                    <h2 className="text-2xl font-black">คิดเงิน โต๊ะ {activeTable}</h2>
                                </div>

                                <div className="flex gap-2 mb-6">
                                    <button onClick={() => setPaymentMethod('cash')} className={`flex-1 py-4 rounded-2xl font-black flex items-center justify-center gap-2 transition-all ${paymentMethod === 'cash' ? 'bg-red-700 text-white shadow-lg' : 'bg-white text-slate-400 border'}`}><Icon name="Banknote" size={20} /> เงินสด</button>
                                    <button onClick={() => setPaymentMethod('transfer')} className={`flex-1 py-4 rounded-2xl font-black flex items-center justify-center gap-2 transition-all ${paymentMethod === 'transfer' ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-400 border'}`}><Icon name="CreditCard" size={20} /> โอนเงิน</button>
                                </div>

                                {paymentMethod === 'cash' && (
                                    <div className="bg-white p-6 rounded-[2.5rem] border border-red-100 mb-6 shadow-sm">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase text-center mb-2 tracking-widest uppercase font-black">ยอดรับเงิน (บาท)</p>
                                        <input type="number" value={receivedAmount} onChange={e => setReceivedAmount(e.target.value)} placeholder="0.00" className="w-full text-5xl font-black text-center text-red-600 outline-none bg-slate-50 py-4 rounded-2xl mb-4" />
                                        {change >= 0 && (
                                            <div className="bg-green-50 p-4 rounded-2xl text-center border border-green-100 animate-in">
                                                <p className="text-[10px] font-bold text-green-600 uppercase">เงินทอน</p>
                                                <p className="text-3xl font-black text-green-700">฿{change.toFixed(2)}</p>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* --- PROFESSIONAL RECEIPT DESIGN (No Overlap) --- */}
                                <div className="receipt-print-area receipt-font mb-10 shadow-2xl" ref={receiptRef}>
                                    <div className="flex flex-col items-center gap-2 mb-8">
                                        <div className="text-center">
                                            <h3 className="text-[52px] font-black text-red-700 leading-none tracking-tighter" style={{ marginBottom: '5px' }}>แม่บุญส่ง</h3>
                                            <p className="text-[11px] font-bold text-slate-400 uppercase tracking-[0.4em]">THAI NOODLE SPECIALIST</p>
                                        </div>
                                        <div className="dashed-line" style={{ margin: '15px 0' }}></div>
                                        <div className="w-full flex justify-between items-center font-bold text-[14px] text-slate-900">
                                            <span className="bg-slate-900 text-white px-4 py-1 rounded-full uppercase tracking-widest">TABLE {activeTable}</span>
                                            <span className="opacity-40">#ID-{Math.floor(1000 + Math.random() * 9000)}</span>
                                        </div>
                                        <p className="w-full text-[12px] text-slate-400 text-left mt-2">{new Date().toLocaleString('th-TH')}</p>
                                    </div>

                                    <div className="space-y-6 mb-10 min-h-[150px]">
                                        <div className="flex justify-between text-[12px] font-black text-slate-300 border-b-2 border-slate-100 pb-2 uppercase tracking-widest"><span>รายการอาหาร</span><span>รวม (บาท)</span></div>
                                        {(tables[activeTable] || []).map((item, i) => (
                                            <div key={i} className="flex justify-between items-start text-[17px] gap-6">
                                                <div className="flex-1">
                                                    <p className="font-bold text-slate-800 leading-tight break-words">{item.name}</p>
                                                    {item.details && <p className="text-[11px] text-red-500 font-bold mt-1.5 leading-tight">{item.details.join(', ')}</p>}
                                                    <p className="text-[12px] text-slate-400 font-bold uppercase mt-1">฿{item.price} x {item.quantity}</p>
                                                </div>
                                                <span className="font-black text-slate-900 text-xl">฿{item.price * item.quantity}</span>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="dashed-line" style={{ margin: '20px 0' }}></div>
                                    <div className="space-y-4 mb-10">
                                        <div className="flex justify-between items-center text-slate-800 font-bold">
                                            <span className="text-[13px] uppercase opacity-50 tracking-widest">ชำระโดย</span>
                                            <span className="text-xl uppercase">{paymentMethod === 'cash' ? 'เงินสด (CASH)' : 'เงินโอน (QR)'}</span>
                                        </div>
                                        {paymentMethod === 'cash' && receivedAmount && (
                                            <div className="flex justify-between items-center text-slate-400 text-sm italic border-t border-slate-50 pt-2">
                                                <span>รับเงินมา:</span><span>฿{parseFloat(receivedAmount).toFixed(2)}</span>
                                            </div>
                                        )}
                                        <div className="flex justify-between items-center pt-3 border-t-2 border-slate-50">
                                            <span className="text-sm font-bold text-slate-400 uppercase tracking-widest">ยอดสุทธิ</span>
                                            <span className="text-[44px] font-black text-red-700 leading-none">฿{total}</span>
                                        </div>
                                        {paymentMethod === 'cash' && change >= 0 && (
                                            <div className="flex justify-between items-center pt-5 text-green-600 font-black border-t-2 border-dashed border-green-100">
                                                <span className="text-sm uppercase tracking-widest">เงินทอน:</span><span className="text-[34px] leading-none underline decoration-4 decoration-green-100">฿{change.toFixed(2)}</span>
                                            </div>
                                        )}
                                    </div>
                                    
                                    {paymentMethod === 'transfer' && (
                                        <div className="bg-slate-50 p-8 rounded-[2rem] border border-slate-100 text-center mb-10 animate-in">
                                            <p className="text-[11px] font-bold text-slate-400 mb-3 uppercase tracking-widest">สแกนจ่ายผ่าน QR Code</p>
                                            <img src={`https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(generateQR(total))}`} className="w-48 h-48 mx-auto rounded-2xl mb-4 shadow-lg border-4 border-white" />
                                            <p className="font-black text-blue-600 text-2xl tracking-tighter">389-7-20852-0</p>
                                            <p className="text-[11px] font-bold text-slate-400 uppercase tracking-[0.2em] mt-1">ธนาคารกรุงเทพ • คุณแม่บุญส่ง</p>
                                        </div>
                                    )}

                                    <div className="text-center pt-6 border-t-2 border-dashed border-slate-100">
                                        <div className="flex items-center justify-center gap-3 text-red-500 font-black italic text-[24px] mb-2 leading-none">
                                            <Icon name="Heart" size={24} fill="currentColor" /> ขอบคุณครับ <Icon name="Heart" size={24} fill="currentColor" />
                                        </div>
                                        <p className="text-[10px] font-bold text-slate-300 uppercase tracking-[0.3em] mt-3">Tasty • Fresh • Best Quality</p>
                                    </div>
                                    <div className="receipt-zigzag"></div>
                                </div>

                                <div className="space-y-4 px-2">
                                    <button onClick={saveAndDownload} disabled={isProcessing} className="w-full py-5 bg-slate-900 text-white rounded-[2.5rem] font-black text-xl shadow-xl active-scale flex items-center justify-center gap-3 transition-all"><Icon name="Download" size={24} /> {isProcessing ? "กำลังเซฟรูป..." : "โหลดบิลลงเครื่อง (ส่งไลน์)"}</button>
                                    <button onClick={() => { if(confirm('ยืนยันจ่ายเงินและล้างโต๊ะ?')) { const n = {...tables}; delete n[activeTable]; setTables(n); setView('table-selection'); setActiveTable(null); } }} className="w-full py-5 bg-green-600 text-white rounded-[2.5rem] font-black text-2xl shadow-xl active-scale flex items-center justify-center gap-3 transition-all"><Icon name="CheckCircle2" size={32} /> จ่ายเงินและล้างโต๊ะ</button>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* --- FOUR GIRLS MODAL --- */}
                    {fourGirlsModal && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[100] flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-sm rounded-[3rem] shadow-2xl overflow-hidden border-t-8 border-red-700 animate-in">
                                <div className="p-8 text-center border-b border-slate-50"><h2 className="text-2xl font-black text-slate-900 tracking-tight flex items-center justify-center gap-2 font-black italic"><Icon name="Star" size={28} className="text-yellow-400 fill-current" /> เลือกน้ำยา 4 อย่าง</h2><p className="text-[10px] text-red-600 font-black mt-2 uppercase tracking-widest">ชุดสี่สาว • 140 บาท</p></div>
                                <div className="p-8">
                                    <div className="flex gap-2 mb-8 justify-center">{[0,1,2,3].map(i => <div key={i} className={`w-14 h-14 rounded-2xl border-2 flex items-center justify-center font-black text-[10px] transition-all duration-300 ${tempCurries[i] ? 'bg-red-50 border-red-500 text-red-700 scale-110 shadow-md' : 'border-dashed border-slate-200 text-slate-300'}`}>{tempCurries[i] || i+1}</div>)}</div>
                                    <div className="grid grid-cols-2 gap-2 mb-10">{CURRY_OPTIONS.map(c => <button key={c} onClick={() => tempCurries.length < 4 && setTempCurries([...tempCurries, c])} className={`p-4 rounded-2xl border-2 text-xs font-black transition-all ${tempCurries.length >= 4 ? 'opacity-30' : 'bg-white border-slate-100 text-slate-600 active:bg-red-50 active:border-red-500'}`}>{c}</button>)}</div>
                                    <div className="flex gap-4">
                                        <button onClick={() => setTempCurries(tempCurries.slice(0, -1))} className="flex-1 py-5 bg-slate-100 rounded-2xl font-black text-slate-400 active-scale">ลบ</button>
                                        <button disabled={tempCurries.length < 4} onClick={() => { addItem(MENU.specialSet.find(i => i.id === 'kj_4girls'), tempCurries); setFourGirlsModal(false); }} className={`flex-[2] py-5 rounded-2xl font-black text-xl shadow-lg transition-all ${tempCurries.length < 4 ? 'bg-slate-200 text-slate-400' : 'bg-red-700 text-white active-scale'}`}>เพิ่มลงโต๊ะ</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        setTimeout(() => {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        }, 50);
    </script>
</body>
</html>
