        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
        .active-scale:active { transform: scale(0.96); transition: transform 0.1s; }
        
        /* Receipt UI - Responsive */
        .receipt-print-area { background: white; width: 100%; max-width: 400px; padding: 32px 22px; position: relative; border-top: 10px solid #b91c1c; margin: 0 auto; box-sizing: border-box; }

        .dashed-line { border-top: 2px dashed #cbd5e1; margin: 14px 0; width: 100%; }
        
        #app-loading { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 1rem; color: #b91c1c; font-weight: 800; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #b91c1c; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Category scroll offset */

        /* Receipt scroll box for cleaner checkout page */

                const initDb = async () => {
                    if (!supabase) {
                        setIsOnline(false);
                        setIsDbLoading(false);
                        return;
                    }
                    try {
                        // Fetch menu
                        const { data: menuData, error: menuErr } = await supabase
                            .from('pos_menu')
                            .select('*')
                            .order('category_key', { ascending: true })
                            .order('item_order', { ascending: true });

                        if (menuErr) throw menuErr;
                        setIsOnline(true);

                        // If DB menu is empty, upload default menu items
                        if (!menuData || menuData.length === 0) {
                            const itemsToInsert = [];
                            Object.entries(DEFAULT_MENU).forEach(([catKey, items]) => {
                                items.forEach((item, idx) => {
                                    itemsToInsert.push({
                                        id: item.id,
                                        category_key: catKey,
                                        category_name: item.category,
                                        name: item.name,
                                        price: item.price,
                                        is_special: !!item.isSpecial,
                                        item_order: idx
                                    });
                                });
                            });
                            await supabase.from('pos_menu').insert(itemsToInsert);
                            setMenu(DEFAULT_MENU);
                        } else {
                            const mappedMenu = {};
                            menuData.forEach(item => {
                                if (!mappedMenu[item.category_key]) mappedMenu[item.category_key] = [];
                                mappedMenu[item.category_key].push({
                                    id: item.id,
                                    name: item.name,
                                    price: Number(item.price),
                                    category: item.category_name,
                                    isSpecial: item.is_special
                                });
                            });
                            setMenu(mappedMenu);
                        }

                        const { data: tablesData, error: tablesErr } = await supabase
                            .from('pos_tables')
                            .select('*');
                        if (tablesErr) throw tablesErr;

                        const mappedTables = {};
                        tablesData.forEach(t => {
                            mappedTables[t.table_number] = t.items;
                        });

                        console.error("Failed to connect to Supabase database:", e);
                        setIsOnline(false);
                    } finally {
                        setIsDbLoading(false);
                    }

                            const copy = { ...prev };
                            delete copy[catKey];
                            return copy;
                        }
                        return { ...prev, [catKey]: newItems };

                        try {
                            await supabase

                                .eq('id', itemId);

                                        id: item.id,
                                        category_key: catKey,
                                        category_name: item.category,
                                        name: item.name,
                                        price: item.price,
                                        is_special: !!item.isSpecial,
                                        item_order: idx
                                    });
                                });
                            });
                            await supabase.from('pos_menu').insert(itemsToInsert);
                        } catch (e) {
                            console.error("Supabase reset error:", e);
                        }
                    }
                });
            };

            // --- Order Functions ---
            const addItem = (item, details = null) => {
                if (item.id === 'kj_4girls' && !details) {
                    setTempCurries([]);
                    setFourGirlsModal(true);
                    return;
                }
                setTables(prev => {
                    const list = prev[activeTable] || [];
                    const entryId = details ? `${item.id}-${details.join('-')}` : item.id;
                    const idx = list.findIndex(i => i.entryId === entryId);
                    let newList;
                    if (idx > -1) { newList = [...list]; newList[idx].quantity += 1; }
                    else { newList = [...list, { ...item, entryId, details, quantity: 1 }]; }
                    updateTableOnSupabase(activeTable, newList);
                    return { ...prev, [activeTable]: newList };
                });
            };

            const addCustom = () => {
                if (!customName || !customPrice) return;
                addItem({ id: `c-${Date.now()}`, name: customName, price: parseFloat(customPrice), category: 'พิเศษ' });
                setCustomName(''); setCustomPrice(''); setShowCustomForm(false);
            };

            const removeItem = (id) => {
                setTables(prev => {
                    const list = prev[activeTable] || [];
                    const idx = list.findIndex(i => i.entryId === id);
                    if (idx === -1) return prev;
                    let next = [...list];
                    if (next[idx].quantity > 1) { 
                        next[idx].quantity -= 1; 
                        updateTableOnSupabase(activeTable, next);
                        return { ...prev, [activeTable]: next }; 
                    }
                    const newList = list.filter(i => i.entryId !== id);
                    updateTableOnSupabase(activeTable, newList);
                    return { ...prev, [activeTable]: newList };
                });
            };

            // --- Confirm Order & Clear Table ---
            const payAndClearTable = async () => {
                const orderItems = tables[activeTable] || [];
                if (orderItems.length === 0) return;

                const saleRecord = {
                    table_number: activeTable,
                    order_id: `#ID-${orderId}`,
                    items: orderItems,
                    total: total,
                    payment_method: paymentMethod,
                    received_amount: paymentMethod === 'cash' ? (parseFloat(receivedAmount) || total) : null,
                    change_amount: paymentMethod === 'cash' ? (receivedAmount ? parseFloat(receivedAmount) - total : 0) : null,
                    created_at: new Date().toISOString()
                };

                // Save to Supabase Sales
                if (isOnline && supabase) {
                    try {
                        await supabase.from('pos_sales').insert(saleRecord);
                    } catch (e) {
                        console.error("Supabase record sale error:", e);
                    }
                } else {
                    const localSales = JSON.parse(localStorage.getItem('mb_pos_local_sales') || '[]');
                    localSales.push(saleRecord);
                    localStorage.setItem('mb_pos_local_sales', JSON.stringify(localSales));
                }

                // Clear table in Supabase
                await updateTableOnSupabase(activeTable, []);

                // Clear locally
                setTables(prev => {
                    const nextTables = { ...prev };
                    delete nextTables[activeTable];
                    return nextTables;
                });
                setView('table-selection');
                setActiveTable(null);
            };

            // --- Daily Sales Summary Loader ---
            const fetchSalesForDate = async (dateStr) => {
                setSalesLoading(true);
                const startOfDay = `${dateStr}T00:00:00.000Z`;
                const endOfDay = `${dateStr}T23:59:59.999Z`;

                if (isOnline && supabase) {
                    try {
                        const { data, error } = await supabase
                            .from('pos_sales')
                            .select('*')
                            .gte('created_at', startOfDay)
                            .lte('created_at', endOfDay)
                            .order('created_at', { ascending: false });

                        if (error) throw error;
                        setSalesData(data || []);
                    } catch (e) {
                        console.error("Error fetching sales data:", e);
                    } finally {
                        setSalesLoading(false);
                    }
                } else {
                    const localSales = JSON.parse(localStorage.getItem('mb_pos_local_sales') || '[]');
                    const filtered = localSales.filter(s => {
                        const sDate = s.created_at.split('T')[0];
                        return sDate === dateStr;
                    });
                    setSalesData(filtered);
                    setSalesLoading(false);
                }
            };

            useEffect(() => {
                if (showSalesSummary) {
                    fetchSalesForDate(salesDate);
                }
            }, [salesDate, showSalesSummary]);

            // --- Receipt Downloader ---
            const saveAndDownload = async () => {
                if (!receiptRef.current) return;
                setIsProcessing(true);
                try {
                    const el = receiptRef.current;
                    const origMaxW = el.style.maxWidth;
                    const origW = el.style.width;
                    el.style.maxWidth = 'none';
                    el.style.width = '420px';
                    const canvas = await html2canvas(el, { scale: 2.5, backgroundColor: '#ffffff', useCORS: true });
                    el.style.maxWidth = origMaxW || '';
                    el.style.width = origW || '';
                    const link = document.createElement('a');
                    link.download = `Receipt-T${activeTable}-${Date.now()}.png`;
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                } catch (e) { console.error(e); } finally { setIsProcessing(false); }

            const menuKeys = Object.keys(menu);

                                                        </div>

                                                </div>
                                            </div>

                                {/* Current order items */}
                                {(tables[activeTable] || []).length > 0 && (
                                    <div className="mt-12 bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm animate-in">

                                        <div className="divide-y divide-slate-50">
                                            {tables[activeTable].map(item => (

                                                        <p className="font-bold text-slate-700 leading-tight">{item.name}</p>

                                                        <button onClick={() => removeItem(item.entryId)} className="w-8 h-8 bg-white text-slate-400 rounded-lg shadow-sm active-scale flex items-center justify-center"><Icon name="Minus" size={14} /></button>
                                                        <span className="font-black text-lg min-w-[20px] text-center text-red-600">{item.quantity}</span>
                                                        <button onClick={() => addItem(item, item.details)} className="w-8 h-8 bg-red-700 text-white rounded-lg shadow-sm active-scale flex items-center justify-center"><Icon name="Plus" size={14} /></button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Bottom bar */}
                                <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-xl border-t z-40">
                                    <div className="max-w-md mx-auto flex gap-3">
                                        <button onClick={() => showConfirm('ล้างรายการทั้งหมดของโต๊ะนี้?', () => {
                                            setTables(prev => {
                                                const next = { ...prev, [activeTable]: [] };
                                                updateTableOnSupabase(activeTable, []);
                                                return next;
                                            });

                                        <button onClick={() => { setReceivedAmount(''); setView('checkout'); }} disabled={total === 0} className="flex-1 py-5 bg-red-700 text-white rounded-[2rem] font-black text-xl shadow-xl active-scale disabled:bg-slate-200">ดูบิล / คิดเงิน</button>
                                    </div>
                                </div>

                            /* ====== CHECKOUT VIEW ====== */

                                <div className="flex items-center gap-4 mb-6">

                                <div className="flex gap-2 mb-6">
                                    <button onClick={() => setPaymentMethod('cash')} className={`flex-1 py-4 rounded-2xl font-black flex items-center justify-center gap-2 transition-all ${paymentMethod === 'cash' ? 'bg-red-700 text-white shadow-lg' : 'bg-white text-slate-400 border'}`}><Icon name="Banknote" size={20} /> เงินสด</button>
                                    <button onClick={() => setPaymentMethod('transfer')} className={`flex-1 py-4 rounded-2xl font-black flex items-center justify-center gap-2 transition-all ${paymentMethod === 'transfer' ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-400 border'}`}><Icon name="CreditCard" size={20} /> โอนเงิน</button>
                                </div>

                                {paymentMethod === 'cash' && (
                                    <div className="bg-white p-5 rounded-3xl border border-slate-100 mb-6 shadow-sm animate-in">
                                        <p className="text-[10px] font-black text-slate-400 uppercase text-center mb-2 tracking-widest">ยอดรับเงิน (บาท)</p>
                                        <input type="number" value={receivedAmount} onChange={e => setReceivedAmount(e.target.value)} placeholder="0.00" className="w-full text-4xl font-black text-center text-red-600 outline-none bg-slate-50 py-3 rounded-2xl mb-3" />
                                        {receivedAmount && change >= 0 && (
                                            <div className="bg-green-50 p-3 rounded-2xl text-center border border-green-100 animate-in">
                                                <p className="text-[10px] font-bold text-green-600 uppercase">เงินทอน</p>
                                                <p className="text-2xl font-black text-green-700">฿{change.toFixed(2)}</p>
                                            </div>
                                        )}
                                    </div>

                                {paymentMethod === 'transfer' && (
                                    <div className="bg-gradient-to-br from-blue-600 to-blue-700 p-6 rounded-3xl mb-6 shadow-xl text-center animate-in">

                                        <div className="bg-white/15 backdrop-blur-sm rounded-2xl p-5 mb-4">

                                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderTop: '1px solid #f8fafc', paddingTop: '6px', marginTop: '6px' }}>
                                                    <span className="text-slate-400" style={{ fontSize: '11px' }}>รับเงินมา:</span>
                                                    <span className="text-slate-400" style={{ fontSize: '11px' }}>฿{Number(selectedReceiptForView.received_amount).toFixed(2)}</span>
                                                </div>
                                            )}
                                        </div>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderTop: '2px solid #f1f5f9', paddingTop: '12px' }}>
                                            <span className="font-bold text-slate-400 uppercase" style={{ fontSize: '11px', letterSpacing: '0.15em' }}>ยอดสุทธิ</span>
                                            <span className="font-black text-red-700" style={{ fontSize: '36px', lineHeight: 1 }}>฿{selectedReceiptForView.total}</span>
                                        </div>
                                        {selectedReceiptForView.payment_method === 'cash' && selectedReceiptForView.received_amount && selectedReceiptForView.change_amount !== null && (
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderTop: '2px dashed #dcfce7', paddingTop: '10px', marginTop: '10px' }}>
                                                <span className="font-black text-green-600 uppercase" style={{ fontSize: '11px', letterSpacing: '0.15em' }}>เงินทอน:</span>
                                                <span className="font-black text-green-600" style={{ fontSize: '28px', lineHeight: 1 }}>฿{Number(selectedReceiptForView.change_amount).toFixed(2)}</span>
                                            </div>
                                        )}
                                        {selectedReceiptForView.payment_method === 'transfer' && (
                                            <div style={{ borderTop: '2px dashed #bfdbfe', paddingTop: '14px', marginTop: '14px', textAlign: 'center' }}>
                                                <p className="font-bold text-slate-400 uppercase" style={{ fontSize: '9px', letterSpacing: '0.15em', marginBottom: '4px' }}>โอนเข้าบัญชี</p>
                                                <p className="font-black text-blue-600" style={{ fontSize: '16px', letterSpacing: '0.1em' }}>389-7-20852-0</p>
                                                <p className="font-bold text-slate-400" style={{ fontSize: '9px', marginTop: '2px' }}>ธนาคารกรุงเทพ • คุณแม่บุญส่ง</p>
                                            </div>
                                        )}
                                        <div style={{ textAlign: 'center', borderTop: '2px dashed #f1f5f9', paddingTop: '16px', marginTop: '16px' }}>
                                            <div className="font-black text-red-500" style={{ fontSize: '20px', marginBottom: '4px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px' }}>
                                                <Icon name="Heart" size={18} /> ขอบคุณครับ <Icon name="Heart" size={18} />
                                            </div>
                                            <p className="font-bold text-slate-300 uppercase" style={{ fontSize: '8px', letterSpacing: '0.25em', marginTop: '6px' }}>Tasty • Fresh • Best Quality</p>
                                        </div>
                                        <div className="receipt-zigzag"></div>
                                    </div>
                                </div>

                                <div className="flex gap-2">
                                    <button onClick={async () => {
                                        if (!historyReceiptRef.current) return;
                                        setIsProcessing(true);
                                        try {
                                            const el = historyReceiptRef.current;
                                            const origMaxW = el.style.maxWidth;
                                            const origW = el.style.width;
                                            el.style.maxWidth = 'none';
                                            el.style.width = '420px';
                                            const canvas = await html2canvas(el, { scale: 2.5, backgroundColor: '#ffffff', useCORS: true });
                                            el.style.maxWidth = origMaxW || '';
                                            el.style.width = origW || '';
                                            const link = document.createElement('a');
                                            link.download = `Receipt-History-${selectedReceiptForView.order_id}.png`;
                                            link.href = canvas.toDataURL("image/png");
                                            link.click();
                                        } catch (e) { console.error(e); } finally { setIsProcessing(false); }
                                    }} disabled={isProcessing} className="flex-1 py-4 bg-slate-900 text-white rounded-2xl font-black text-sm active-scale flex items-center justify-center gap-2">
                                        <Icon name="Download" size={16} /> {isProcessing ? "เซฟ..." : "โหลดบิล"}
                                    </button>
                                    <button onClick={() => setSelectedReceiptForView(null)} className="flex-1 py-4 bg-slate-100 text-slate-500 rounded-2xl font-black text-sm active-scale">ปิด</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ====== CUSTOM CONFIRM MODAL ====== */}
                    {confirmModal && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[200] flex items-center justify-center p-6">
                            <div className="bg-white w-full max-w-xs rounded-[2rem] shadow-2xl p-7 text-center animate-in">
                                <div className="w-14 h-14 bg-red-50 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                    <Icon name="Trash2" size={24} className="text-red-500" />
                                </div>
                                <p className="font-bold text-lg text-slate-800 mb-6 leading-snug">{confirmModal.message}</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setConfirmModal(null)} className="flex-1 py-3.5 bg-slate-100 rounded-2xl font-black text-slate-400 active-scale">ยกเลิก</button>
                                    <button onClick={() => { confirmModal.onConfirm(); setConfirmModal(null); }} className="flex-1 py-3.5 bg-red-600 text-white rounded-2xl font-black active-scale shadow-lg">ยืนยัน</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        setTimeout(() => {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        }, 50);
    </script>
</body>
</html>
